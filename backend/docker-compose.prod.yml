# Production stack for the VPS -- BACKEND ONLY.
# The frontend is deployed separately on Cloudflare Pages.
#
#   ./deploy.sh
#
# Everything talks over the private "app-network". Only Caddy publishes ports
# (80/443) to the internet -- the database and PHP are unreachable from outside.
name: api

services:
  # --- Public entrypoint. Gets free HTTPS certificates automatically. --------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      DB_DOMAIN: ${DB_DOMAIN}
      DB_AUTH_USER: ${DB_AUTH_USER}
      DB_AUTH_HASH: ${DB_AUTH_HASH}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - phpmyadmin
    networks:
      - app-network

  # --- Nginx: serves Laravel's public/ and hands .php to the app container --
  web:
    build:
      context: .
      target: nginx
    image: laravel-api-web:prod
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      # Read-only so uploaded files under storage/app/public can be served.
      - laravel-storage:/var/www/html/storage:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  # --- Laravel (PHP-FPM). Code + vendor are baked into the image. -----------
  app:
    build:
      context: .
      target: production
    image: laravel-api-app:prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # The database is a container named "db", not localhost.
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Keeps logs and uploaded files alive across deploys.
      - laravel-storage:/var/www/html/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "php -r '$$socket = @fsockopen(\"127.0.0.1\", 9000); exit($$socket ? 0 : 1);'",
        ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 120s
    networks:
      - app-network

  # --- MySQL. No "ports:" on purpose -- nothing outside can reach it. -------
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network

  # --- phpMyAdmin. Also has no "ports:" -- the only way in is through Caddy,
  # --- which asks for a password first.
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # Tells phpMyAdmin it is being reached over https, so it stops
      # redirecting the browser back to http.
      PMA_ABSOLUTE_URI: https://${DB_DOMAIN}/
      UPLOAD_LIMIT: 64M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
  laravel-storage:
  caddy-data:
  caddy-config:
