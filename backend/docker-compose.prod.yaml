name: api

services:
  web:
    build:
      context: .
      target: nginx
    image: laravel-api-web:prod
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports: 
      - "127.0.0.1:8000:80"
    volumes:
      # Read-only so uploaded files under storage/app/public can be served.
      - laravel-storage:/var/www/html/storage:ro
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost/up >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-network

  # --- Laravel (PHP-FPM). Code + vendor are baked into the image. -----------
  app:
    build:
      context: .
      target: production
    image: laravel-api-app:prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - laravel-storage:/var/www/html/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'php -r ''$$socket = @fsockopen("127.0.0.1", 9000); exit($$socket ? 0 : 1);''',
        ]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 120s
    networks:
      - app-network

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app-network
 
  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports: 
      - "127.0.0.1:8001:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: https://${DB_DOMAIN}/
      UPLOAD_LIMIT: 64M
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql-data:
  laravel-storage: